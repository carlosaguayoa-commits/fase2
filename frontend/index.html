<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Fraude | Fase II</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h2>Clasificador de Transacciones</h2>
        <form id="transaccion-form">
            <div class="form-group">
                <label for="monto">Monto de la transacción ($):</label>
                <input type="number" id="monto" step="0.01" required placeholder="Ej. 900.00">
            </div>

            <div class="form-group">
                <label for="hora">Hora (0 a 23):</label>
                <input type="number" id="hora" min="0" max="23" required placeholder="Ej. 1">
            </div>

            <div class="form-group">
                <label for="pais_riesgoso">¿País de alto riesgo?:</label>
                <select id="pais_riesgoso" required>
                    <option value="0">No (0)</option>
                    <option value="1">Sí (1)</option>
                </select>
            </div>

            <button type="submit" id="btn-enviar">Evaluar Riesgo</button>
        </form>

        <div id="resultado-box" class="resultado oculto">
            <h3>Resultado del Modelo</h3>
            <p><strong>Dictamen:</strong> <span id="tag-dictamen"></span></p>
            <p><strong>Probabilidad Fraude:</strong> <span id="prob-fraude"></span></p>
            <p><strong>Probabilidad Legítima:</strong> <span id="prob-legitima"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
